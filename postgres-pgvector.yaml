apiVersion: v1
kind: Secret
metadata:
  name: ogx-postgres
# NOTE: replace these before any real deployment.
stringData:
  database-user: ogx
  database-password: CHANGEME-app-password
  database-name: ogx
  database-admin-password: CHANGEME-admin-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ogx-postgres-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogx-postgres
  labels: {app: ogx-postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: ogx-postgres}}
  template:
    metadata:
      labels:
        app: ogx-postgres
        kueue.x-k8s.io/queue-name: default
    spec:
      containers:
      - name: postgresql
        image: quay.io/rh-aiservices-bu/postgresql-15-pgvector-c9s:latest
        ports: [{containerPort: 5432, name: postgresql}]
        env:
        - {name: POSTGRESQL_USER,      valueFrom: {secretKeyRef: {name: ogx-postgres, key: database-user}}}
        - {name: POSTGRESQL_PASSWORD,  valueFrom: {secretKeyRef: {name: ogx-postgres, key: database-password}}}
        - {name: POSTGRESQL_DATABASE,  valueFrom: {secretKeyRef: {name: ogx-postgres, key: database-name}}}
        - {name: POSTGRESQL_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: ogx-postgres, key: database-admin-password}}}
        resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: "1", memory: 2Gi}}
        volumeMounts: [{name: data, mountPath: /var/lib/pgsql/data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ogx-postgres-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: ogx-postgres
spec:
  selector: {app: ogx-postgres}
  ports: [{port: 5432, targetPort: 5432, name: postgresql}]
